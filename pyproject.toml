[project]
name = "regimetrader"
version = "0.1.0"
description = "Regime-aware stock direction predictor and paper-trading bot on a Nifty 50 data warehouse (academic project)"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: integration, smoke, replay and dashboard tests (excluded from `make check`)",
]
