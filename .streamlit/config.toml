# Streamlit configuration, committed so a fresh clone runs without prompting.
#
# `gatherUsageStats = false` disables telemetry. Streamlit's first-run "Email:"
# onboarding prompt is NOT suppressed by this setting, nor by the
# `--browser.gatherUsageStats false` command-line switch in Streamlit 1.65; it is
# suppressed only by `--server.headless true`, which the `dashboard` Makefile target
# passes. That was found by running the documented command for real rather than
# trusting that it worked. See `DECISIONS` R50.
[browser]
gatherUsageStats = false

[client]
# Hide the "Deploy" button and the developer menu for the viva demo (R50-adjacent
# polish): a visitor gets exactly what a read-only app should look like. "viewer"
# changes no behaviour beyond trimming Streamlit's dev chrome, and applies equally to
# `make dashboard` and the `make demo` tunnel window (same working directory).
toolbarMode = "viewer"